<div class="card-publicacion p-4 border rounded-lg shadow-sm bg-white mb-4">
  <!-- Aquí puedes poner la info de tu publicación (título, descripción, imagen, etc.) -->
  <h3 class="font-bold text-lg">{{ publicacion?.titulo }}</h3>
  <p class="text-gray-600 my-2">{{ publicacion?.descripcion }}</p>

  <!-- Botón de Me Gusta -->
  <div class="flex items-center gap-2 mt-4">
    <button 
      type="button" 
      class="btn-like flex items-center gap-1.5 px-3 py-1.5 rounded-full border transition-all cursor-pointer"
      [class.liked]="hasLiked"
      (click)="onToggleLike()"
      [disabled]="cargandoLike">
      
      <!-- Corazón dinámico -->
      <span class="icon">{{ hasLiked ? '❤️' : '🤍' }}</span>
      
      <!-- Conteo de Likes -->
      <span class="count text-sm font-semibold">{{ totalLikes }}</span>
    </button>
  </div>
</div>
